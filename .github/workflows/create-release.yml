name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer (e.g. v1.6.3)'
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false
      draft:
        required: false
        type: boolean
        default: false
      release_notes:
        description: 'Optional text appended below the changelog entry'
        required: false
        type: string
      allow_older_version:
        description: 'Bypass version order (hotfix)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    uses: fwullschleger/github-actions/.github/workflows/grav-plugin-release.yml@v1
    permissions:
      contents: write
    with:
      version:             ${{ inputs.version }}
      prerelease:          ${{ inputs.prerelease }}
      draft:               ${{ inputs.draft }}
      release_notes:       ${{ inputs.release_notes }}
      allow_older_version: ${{ inputs.allow_older_version }}
